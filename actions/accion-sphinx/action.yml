name: 'Generar Documentacion de python'
description: 'Genera documentacion de Sphinx '

runs: 
  using: "composite"
  steps:
  
  - name: instalar python
    uses: actions/setup-python@v5
    with: 
      python-version: '3.11'

  - name: instalar sphinx
    shell: bash
    run: pip install sphinx

  - name: genera documentacion
    shell: bash
    run: |
      sphinx-apidoc -o docs/python python/
      sphinx-build -b html docs/python docs/python/html