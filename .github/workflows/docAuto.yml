name: "Crear Documentacion automaticamente"

on:
  push:
  workflow_dispatch:

permisions:
  contents: write

jobs:
  generar-documentacion:
    runs-on: ubuntu-latest
    steps:
    - name: descarga de repositorio
      uses: actions/checkout@v7

    - name: creacion de docs de PHP
      uses: ./actions/accion-phpdoc

    - name: creacion de docs de JS
      uses: ./actions/accion-jsdocs

    - name: creacion de docs con python
      uses: ./actions/accion-sphinx
    
    - name: añadir documentacion al repositorio
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add docs/
        git commit -m "documentacion generada con exito"
        git push